<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Les Petites Lucioles — micro-crèches à Bosgouet et Routot</title><link rel="stylesheet" href="../../styles.css"></head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="MaisonScreen.jsx"></script>
<script type="text/babel" src="PagesScreens.jsx"></script>
<script type="text/babel" src="PreinscriptionScreen.jsx"></script>
<script type="text/babel">
const { SiteHeader, SiteFooter } = DS;
function App(){
  const [page,setPage]=React.useState("Accueil");
  const go=(p)=>{setPage(p);window.scrollTo({top:0,behavior:"smooth"});};
  const screens={
    "Accueil":<HomeScreen go={go} />,
    "La maison des Lucioles":<MaisonScreen go={go} />,
    "Routot":<RoutotScreen go={go} />,
    "Une journée chez les Lucioles":<JourneeScreen go={go} />,
    "Tarification":<TarifsScreen go={go} />,
    "L'équipe des Lucioles":<EquipeScreen go={go} />,
    "Pré-inscription":<PreinscriptionScreen />,
  };
  return(<div>
    <SiteHeader logo="../../assets/logo.png" items={NAV} active={NAV.includes(page)?page:null} onNavigate={go} />
    {screens[page]}
    <SiteFooter logo="../../assets/logo.png" onNavigate={go}
      columns={[["Accueil","La maison des Lucioles","Une journée chez les Lucioles"],["Tarification","L'équipe des Lucioles","Pré-inscription"]]}
      contact={[{icon:"phone",label:"02 77 73 07 24"},{icon:"mail",label:"lespetiteslucioles27@gmail.com"},{icon:"facebook",label:"Les Petites Lucioles"}]} />
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
